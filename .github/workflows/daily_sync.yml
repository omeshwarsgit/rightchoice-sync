name: RightChoice Daily Review Sync

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install playwright gspread google-auth

      - name: Install Playwright browsers
        run: |
          playwright install chromium --with-deps

      - name: Export reviews from RightChoice
        env:
          RIGHTCHOICE_EMAIL: ${{ secrets.RIGHTCHOICE_EMAIL }}
          RIGHTCHOICE_PASSWORD: ${{ secrets.RIGHTCHOICE_PASSWORD }}
          OUTPUT_CSV_PATH: ./output/reviews_yesterday.csv
        run: |
          python export_rightchoice_reviews.py

      - name: Upload rows to Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          INPUT_CSV_PATH: ./output/reviews_yesterday.csv
        run: |
          python upload_to_sheets.py

      - name: Upload screenshots and CSV as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: ./output/
          retention-days: 7
